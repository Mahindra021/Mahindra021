      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="280" rx="22" fill="url(#bg)"/>
  <circle cx="1000" cy="30" r="250" fill="url(#glow)"/>
